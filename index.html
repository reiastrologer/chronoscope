          const cands = [...divs].filter(el => !el.dataset.mwCard && qualifies(el));
          for (const el of cands) {
            if ([...el.querySelectorAll('div')].some(d => qualifies(d))) continue; // 一番内側のカードだけ
            el.dataset.mwCard = '1';
            const hint = document.createElement('div');
            hint.className = 'mwHint';
            hint.textContent = '🔍 タップでこの配置の円を見る';
            el.appendChild(hint);
          }
        }
        document.addEventListener('click', (e) => {
          const card = e.target.closest && e.target.closest('[data-mw-card]');
          if (card) openWheel(card).catch(() => {});
        });
        document.getElementById('mwClose').addEventListener('click', () => { document.getElementById('mwModal').style.display = 'none'; });
        document.getElementById('mwModal').addEventListener('click', (e) => { if (e.target.id === 'mwModal') e.target.style.display = 'none'; });
        let mwTimer = null;
        new MutationObserver(() => { clearTimeout(mwTimer); mwTimer = setTimeout(enhance, 400); }).observe(document.body, { childList: true, subtree: true });
        setTimeout(enhance, 1500);
      } catch (e) { /* 後付け機能が失敗してもアプリ本体には影響させない */ }
    </script>
