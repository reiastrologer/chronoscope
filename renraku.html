if (PM) return;
const mod = await import('./assets/swisseph-BtfJwKK5.js');
const factory = typeof mod.default === 'function'? mod.default: mod.SwissEphModule;

function natalOf(ds, tstr, place) {

}
function fmtD(dt) { return (dt.getUTCMonth() + 1) + '月' + dt.getUTCDate() + '日';}

var box = document.getElementById('rkResult');
box.innerHTML = '<p style="color:#9a8d7a; font-size:13.5px;">計算中…</p>';

var cur = {};

var nA = natalOf(dA, getTimeStr(TA), TA.pl.value), nB = natalOf(dB, getTimeStr(TB), TB.pl.value);

(topDays.length? '<div style="font-size:13px; color:#c5a880; margin-top:6px;">特に連絡が来やすい日：' + topDays.map(function (dy) { var dt = new Date(Date.UTC(+hero.sv[0], +hero.sv[1] - 1, +hero.sv[2] + dy.off)); return fmtD(dt) + '（' + '日月火水木金土'[dt.getUTCDay()] + '）' + ' ' + dy.label;}).join('、') + '</div>': '') +
'<div style="font-size:12px; color:#9a8d7a; margin-top:8px;">※上の期間は、週の区切りをまたぐいちばん濃い7日間。下の週は月曜〜日曜で数えています。ここに出るのは、強い日だけです。</div>' +

var sd = wk.label.split('〜')[0].trim().replace('月', '/').replace('日', '');
html += '<div onclick="var r=document.getElementById(\'wkRow' + wk.i + '\'); if(r) r.scrollIntoView({behavior:\'smooth\', block:\'center\'}); var d=document.getElementById(\'wkDet' + wk.i + '\'); if(d) d.style.display=\'block\';" style="flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:74px; cursor:pointer; border-radius:6px; padding-top:2px;' + (isB? ' background:rgba(255,216,138,0.10);': '') + '">'
+ '<div style="font-size:9px; height:11px; line-height:11px;">' + (isB? '🔥': '') + '</div>'
+ '<div style="width:64%; max-width:20px; border-radius:3px 3px 0 0; background:' + bg + '; height:' + bh + 'px;"></div>'
+ '<div style="font-size:9.5px; color:#9a8d7a; margin-top:2px; height:13px;">' + sd + '</div>'
+ '<div style="font-size:9px; color:#8a8178; height:12px;">' + (wk.gS? wk.gS + '件': '') + '</div>'
+ '</div>';
});
html += '</div>';
html += '<div style="font-size:11px; color:#8a8178; margin-top:3px; line-height:1.6;">バーの高さはその週の連絡の配置の濃さです。週をタップすると、その週の内容が開きます。</div>';
html += '<div style="margin-top:16px;">';
weeks.forEach(function (wk) {
var isBest = hero && (wk.i * 7 <= hero.s + 6) && (wk.i * 7 + 6 >= hero.s);
html += '<div id="wkRow' + wk.i + '" style="border:1px solid ' + (isBest? '#ffd88a': '#4a4238') + '; border-radius:12px; padding:12px 14px; margin-bottom:10px; background:rgba(255,255,255,0.02);">' +
'<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;"><span style="font-weight:700; color:' + (isBest? '#ffe9b8': '#faf6f0') + ';">' + (isBest? '🔥 ': '') + wk.label + '</span><span style="font-size:12.5px; color:#ffd88a;">' + (wk.gS? '連絡がつながりやすい': '静か') + '</span></div>' +
'<div style="height:8px; border-radius:99px; background:#262019; margin-top:8px; overflow:hidden;"><div style="height:100%; width:' + Math.round(wk.good / maxGood * 100) + '%; background:linear-gradient(90deg,#b98a2f,#ffd88a);"></div></div>' +
'<div style="font-size:12.5px; color:#9a8d7a; margin-top:6px;">連絡の配置 ' + wk.gN + '件（うち強いもの ' + wk.gS + '件）</div>' +
(wk.evs.length? '<button type="button" onclick="var d=this.nextElementSibling; d.style.display = d.style.display === \'none\'? \'block\': \'none\';" style="margin-top:8px; background:transparent; color:#ffd88a; border:1px solid #b98a2f; border-radius:999px; padding:5px 14px; font-size:12.5px; font-weight:700; cursor:pointer;">🔍 内容を詳しく見る</button><div id="wkDet' + wk.i + '" style="display:none; margin-top:8px; font-size:13px; line-height:2;">' + wk.evs.map(function (ev) { var dt = new Date(Date.UTC(+wk.sv[0], +wk.sv[1] - 1, +wk.sv[2] + ev.off)); return fmtD(dt) + '（' + '日月火水木金土'[dt.getUTCDay()] + '） ' + ev.label + (ev.strong? ' <span style="color:#ffd88a;">連絡がつながりやすい</span>': ' <span style="color:#c5a880;">言葉が通りやすい</span>');}).join('<br>') + '</div>': '') +
'</div>';
});
html += '</div>';
html += '<p style="font-size:12px; color:#8a8178; line-height:1.8;">いちばん上の表示は、週の区切りにこだわらず、連絡の強い配置がいちばん集まる7日間です。下の週リストは月曜〜日曜で数えています。判定のしかた：水星・木星・金星のトランジットが、二人の水星・金星・月・太陽・木星に良い角度（合・トライン）で触れるものを数えています。オーブは3度。なかでも水星×水星・水星×木星・水星×金星は強く数えています。空の月は除いています。「来ない」という日は出しません。星は傾けるが、縛りはしない——あくまで連絡を待つ目安に。</p>';
box.innerHTML = html;
var __hd = document.querySelector('.topTab'); __hd = __hd? __hd.closest('[style*="sticky"]'): null; var yy = box.getBoundingClientRect().top + window.scrollY - (__hd? __hd.offsetHeight: 0) - 12; window.scrollTo({ top: yy, behavior: 'smooth'});
} catch (err) {

}
});
