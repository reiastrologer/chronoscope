<script>
(function () {
var KEY = 'chronoscope_birth_v1';
var GLYPH = { 0: '☉', 2: '☿', 3: '♀', 4: '♂', 5: '♃', 6: '♄', 7: '♅', 8: '♆', 9: '♇'};
var NAME = { 0: '太陽', 2: '水星', 3: '金星', 4: '火星', 5: '木星', 6: '土星', 7: '天王星', 8: '海王星', 9: '冥王星'};
var IDS = [0, 2, 3, 4, 5, 6, 7, 8, 9];
var ASPG = { 0: '☌', 90: '□', 120: '△', 180: '☍'};
var yS = document.getElementById('bzY'), mS = document.getElementById('bzM'), dS = document.getElementById('bzD');
for (var i = 1930; i <= 2030; i++) { var o = document.createElement('option'); o.value = i; o.textContent = i + '年'; yS.appendChild(o);}
for (var i = 1; i <= 12; i++) { var o2 = document.createElement('option'); o2.value = i; o2.textContent = i + '月'; mS.appendChild(o2);}
for (var i = 1; i <= 31; i++) { var o3 = document.createElement('option'); o3.value = i; o3.textContent = i + '日'; dS.appendChild(o3);}
yS.value = '1990'; mS.value = '1'; dS.value = '1';
try {
var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
if (saved && saved.y) { yS.value = saved.y; mS.value = saved.m; dS.value = saved.d;}
} catch (e) {}
var startEl = document.getElementById('bzStart');
var now = new Date();
startEl.value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

var PM = null, PJD = null;
async function pInit() {
if (PM) return;
const mod = await import('./assets/swisseph-BtfJwKK5.js');
const factory = typeof mod.default === 'function'? mod.default: mod.SwissEphModule;
const wasmBinary = await (await fetch('./assets/swisseph-BmP0Bw24.wasm')).arrayBuffer();
PM = await factory({ instantiateWasm: (imports, success) => { WebAssembly.instantiate(wasmBinary, imports).then(r => success(r.instance, r.module)); return {};}});
PJD = PM.cwrap('swe_julday_wrap', 'number', ['number', 'number', 'number', 'number', 'number']);
}
function pPos(jd, planet) {
const out = PM._malloc(48), err = PM._malloc(256);
const rc = PM.ccall('swe_calc_ut_wrap', 'number', ['number', 'number', 'number', 'number', 'number'], [jd, planet, 260, out, err]);
const lon = rc < 0? NaN: PM.getValue(out, 'double');
PM._free(out); PM._free(err);
return lon;
}
function verdictOf(g, r) {
if (!g &&!r) return '静か';
var df = g - r;
if (df >= 2) return 'プラス強め';
if (df === 1) return 'プラス寄り';
if (df === 0) return '互角';
if (df === -1) return '注意寄り';
return '注意強め';
}
function fmtD(dt) { return (dt.getUTCMonth() + 1) + '月' + dt.getUTCDate() + '日';}

document.getElementById('bzBtn').addEventListener('click', async function () {
var box = document.getElementById('bzResult');
box.innerHTML = '<p style="color:#9a8d7a; font-size:13.5px;">計算中…</p>';
try {
await pInit();
var by = +yS.value, bm = +mS.value, bd = +dS.value;
try {
var prev = {};
try { prev = JSON.parse(localStorage.getItem(KEY) || '{}');} catch (e) {}
prev.y = by; prev.m = bm; prev.d = bd;
localStorage.setItem(KEY, JSON.stringify(prev));
} catch (e) {}
var sv = (startEl.value || '').split('-');
if (sv.length!== 3) { box.innerHTML = '<p style="color:#ff9d85;">探し始める日を選んでください。</p>'; return;}
var jdN = PJD(by, bm, bd, 3.0, 1);
var natal = {};
IDS.forEach(function (id) { natal[id] = pPos(jdN, id);});
var sDate = new Date(Date.UTC(+sv[0], +sv[1] - 1, +sv[2]));
var monOff = (sDate.getUTCDay() + 6) % 7;
var mDate = new Date(sDate.getTime() - monOff * 86400000);
var bv = [mDate.getUTCFullYear(), mDate.getUTCMonth() + 1, mDate.getUTCDate()];
var jd0 = PJD(bv[0], bv[1], bv[2], 3.0, 1);
var SPREAD = [5], VOICE = [0, 3], RISK = [3, 5, 8];
var events = {};
for (var off = -3; off < 59; off++) {
  var jd = jd0 + off;
  var tp = {};
  IDS.forEach(function (id) { tp[id] = pPos(jd, id); });
  IDS.forEach(function (t) {
    IDS.forEach(function (n) {
      var diff = Math.abs(tp[t] - natal[n]) % 360; if (diff > 180) diff = 360 - diff;
      var asp = null, orb = 99;
      [0, 90, 120, 180].forEach(function (a) { var oo = Math.abs(diff - a); if (oo < orb) { orb = oo; asp = a; } });
      if (orb > 3.5 || asp === null) return;
      var isGoodAsp = (asp === 0 || asp === 120);
      var tierA = (SPREAD.indexOf(t) >= 0 && VOICE.indexOf(n) >= 0) || (VOICE.indexOf(t) >= 0 && SPREAD.indexOf(n) >= 0);
      var isBuzzGood = isGoodAsp && (tierA || VOICE.indexOf(n) >= 0);
      var isBuzzRisk = !isGoodAsp && (RISK.indexOf(t) >= 0 || RISK.indexOf(n) >= 0 || VOICE.indexOf(n) >= 0);
      if (!isBuzzGood && !isBuzzRisk) return;
      var mult = tierA ? 1 : 0.5;
      var key = t + '-' + n + '-' + asp;
      if (!events[key] || orb < events[key].minOrb) {
        events[key] = { t: t, n: n, asp: asp, minOrb: orb, peakOff: off, good: isBuzzGood, mult: mult, label: '【 ' + GLYPH[t] + ' ' + ASPG[asp] + ' ' + GLYPH[n] + ' 】' + NAME[t] + '×' + NAME[n] };
      }
    });
  });
}
var weeks = [];
for (var wI = 0; wI < 8; wI++) {
  var sDt = new Date(Date.UTC(bv[0], bv[1] - 1, bv[2] + wI * 7));
  var eDt = new Date(Date.UTC(bv[0], bv[1] - 1, bv[2] + wI * 7 + 6));
  weeks.push({ i: wI, good: 0, risk: 0, score: 0, label: fmtD(sDt) + ' 〜 ' + fmtD(eDt), topDays: [], evs: [], gN: 0, gS: 0, rN: 0, sv: bv });
}
Object.keys(events).forEach(function (key) {
  var ev = events[key];
  if (ev.peakOff < 0 || ev.peakOff >= 56) return;
  var wk = weeks[Math.floor(ev.peakOff / 7)];
  var wgt = (1 - ev.minOrb / 4) * (ev.mult || 1);
  wk.evs.push({ off: ev.peakOff, label: ev.label, good: ev.good, w: wgt });
  if (ev.good) { wk.good += wgt; wk.gN++; if (ev.mult === 1) wk.gS++; wk.topDays.push({ off: ev.peakOff, w: wgt, bestHit: { label: ev.label } }); }
  else { wk.risk += wgt; wk.rN++; }
});
weeks.forEach(function (wk) {
  wk.score = wk.good - wk.risk;
  wk.topDays.sort(function (a, b) { return b.w - a.w; });
  wk.topDays = wk.topDays.slice(0, 3);
  wk.evs.sort(function (a, b) { return a.off - b.off; });
});
var best = null;
weeks.forEach(function (wk) { if (wk.good > 0 && (!best || wk.score > best.score)) best = wk;});
var maxGood = Math.max.apply(null, weeks.map(function (wk) { return wk.good;}).concat([0.01]));
var flat = [];
Object.keys(events).forEach(function (key) { var ev = events[key]; if (ev.peakOff < 0 || ev.peakOff >= 56) return; flat.push({ off: ev.peakOff, good: ev.good, mult: ev.mult, w: (1 - ev.minOrb / 4) * ev.mult, label: ev.label });});
var hero = null;
for (var ws = 0; ws <= 49; ws++) {
  var hg = 0, hr = 0, hgN = 0, hgS = 0, hrN = 0, htds = [];
  flat.forEach(function (ev) { if (ev.off < ws || ev.off > ws + 6) return; if (ev.good) { hg += ev.w; hgN++; if (ev.mult === 1) hgS++; htds.push({ off: ev.off, w: ev.w, bestHit: { label: ev.label } }); } else { hr += ev.w; hrN++; } });
  var hsc = hg - hr;
  if (hg > 0 && (!hero || hsc > hero.score)) { htds.sort(function (a, b) { return b.w - a.w; }); var hsD = new Date(Date.UTC(bv[0], bv[1] - 1, bv[2] + ws)); var heD = new Date(Date.UTC(bv[0], bv[1] - 1, bv[2] + ws + 6)); hero = { s: ws, score: hsc, good: hg, risk: hr, gN: hgN, gS: hgS, rN: hrN, label: fmtD(hsD) + ' 〜 ' + fmtD(heD), topDays: htds.slice(0, 3), sv: bv }; }
}
var html = '';
if (hero) {
html += '<div style="border:1.5px solid #ffd88a; border-radius:14px; padding:18px 16px; background:rgba(255,216,138,0.07); text-align:center;">' +
'<div style="font-size:13px; color:#ffd88a; font-weight:700;">💰 金運の追い風はこの7日間！</div>' +
'<div style="font-family:\'Noto Serif JP\',serif; font-size:24px; font-weight:700; color:#ffe9b8; margin-top:6px;">' + hero.label + '</div>' +
'<div style="font-size:13.5px; color:#faf6f0; margin-top:8px; line-height:1.8;">金運の追い風の配置 ' + hero.gN + '件（うち強いもの ' + hero.gS + '件）・' + verdictOf(Math.round(hero.good), Math.round(hero.risk)) + (hero.rN? '／出費注意の配置も ' + hero.rN + '件ある週。大きな出費は一呼吸置いて。': '') + '</div>' +
(hero.topDays.length? '<div style="font-size:13px; color:#c5a880; margin-top:6px;">特に金運が動きやすい日：' + hero.topDays.map(function (dy) { var dt = new Date(Date.UTC(+hero.sv[0], +hero.sv[1] - 1, +hero.sv[2] + dy.off)); return fmtD(dt) + '（' + '日月火水木金土'[dt.getUTCDay()] + '）' + (dy.bestHit? ' ' + dy.bestHit.label: '');}).join('、') + '</div>': '') +
'<div style="font-size:12px; color:#9a8d7a; margin-top:8px;">※上の期間は、週の区切りをまたぐいちばん濃い7日間。下の週は月曜〜日曜で数えています。</div>' +
'</div>';
} else {
html += '<div style="border:1px solid #4a4238; border-radius:14px; padding:16px; text-align:center; color:#c5a880; font-size:14px;">この8週間は、目立った金運の配置が集まる時期はありませんでした。地道に整える期間です。</div>';
}
var maxPos = Math.max.apply(null, weeks.map(function (wk) { return wk.score; }).concat([0.01]));
var maxNeg = Math.min.apply(null, weeks.map(function (wk) { return wk.score; }).concat([-0.01]));
html += '<div style="font-size:12.5px; font-weight:700; color:#e8cf9f; margin-top:14px;">📊 8週間の波</div>';
html += '<div style="display:flex; gap:2px; margin-top:4px;">';
weeks.forEach(function (wk) {
var isB = hero && (wk.i * 7 <= hero.s + 6) && (wk.i * 7 + 6 >= hero.s);
var bh = wk.score > 0 ? 8 + Math.round(wk.score / maxPos * 32) : (wk.score < 0 ? 8 + Math.round(wk.score / maxNeg * 32) : 2);
var bg = wk.score > 0 ? 'linear-gradient(180deg,#ffd88a,#b98a2f)' : (wk.score < 0 ? 'linear-gradient(180deg,#7a9fc5,#54708f)' : '#38332c');
var sd = wk.label.split('〜')[0].trim().replace('月', '/').replace('日', '');
html += '<div onclick="var r=document.getElementById(\'wkRow' + wk.i + '\'); if(r) r.scrollIntoView({behavior:\'smooth\', block:\'center\'}); var d=document.getElementById(\'wkDet' + wk.i + '\'); if(d) d.style.display=\'block\';" style="flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:74px; cursor:pointer; border-radius:6px; padding-top:2px;' + (isB ? ' background:rgba(255,216,138,0.10);' : '') + '">'
+ '<div style="font-size:9px; height:11px; line-height:11px;">' + (isB ? '🔥' : '') + '</div>'
+ '<div style="width:64%; max-width:20px; border-radius:3px 3px 0 0; background:' + bg + '; height:' + bh + 'px;"></div>'
+ '<div style="font-size:9.5px; color:#9a8d7a; margin-top:2px; height:13px;">' + sd + '</div>'
+ '<div style="font-size:9px; color:#8a8178; height:12px;">' + (wk.gN ? wk.gN + '件' : '') + '</div>'
+ '</div>';
});
html += '</div>';
html += '<div style="font-size:11px; color:#8a8178; margin-top:3px; line-height:1.6;">バーの高さはその週の濃さ（追い風−注意）です。週をタップすると、その週の内容が開きます。</div>';
html += '<div style="margin-top:16px;">';
weeks.forEach(function (wk) {
var isBest = hero && (wk.i * 7 <= hero.s + 6) && (wk.i * 7 + 6 >= hero.s);
html += '<div id="wkRow' + wk.i + '" style="border:1px solid ' + (isBest? '#ffd88a': '#4a4238') + '; border-radius:12px; padding:12px 14px; margin-bottom:10px; background:rgba(255,255,255,0.02);">' +
'<div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;"><span style="font-weight:700; color:' + (isBest? '#ffe9b8': '#faf6f0') + ';">' + (isBest? '🔥 ': '') + wk.label + '</span><span style="font-size:12.5px; color:#ffd88a;">' + verdictOf(Math.round(wk.good), Math.round(wk.risk)) + '</span></div>' +
'<div style="height:8px; border-radius:99px; background:#262019; margin-top:8px; overflow:hidden;"><div style="height:100%; width:' + Math.round(wk.good / maxGood * 100) + '%; background:linear-gradient(90deg,#b98a2f,#ffd88a);"></div></div>' +
'<div style="font-size:12.5px; color:#9a8d7a; margin-top:6px;">金運の追い風の配置 ' + wk.gN + '件（うち強いもの ' + wk.gS + '件）' + (wk.rN? ' ／ 出費注意 ' + wk.rN + '件': '') + '</div>' +
(wk.evs.length? '<button type="button" onclick="var d=this.nextElementSibling; d.style.display = d.style.display === \'none\'? \'block\': \'none\';" style="margin-top:8px; background:transparent; color:#ffd88a; border:1px solid #b98a2f; border-radius:999px; padding:5px 14px; font-size:12.5px; font-weight:700; cursor:pointer;">🔍 内容を詳しく見る</button><div id="wkDet' + wk.i + '" style="display:none; margin-top:8px; font-size:13px; line-height:2;">' + wk.evs.map(function (ev) { var dt = new Date(Date.UTC(+wk.sv[0], +wk.sv[1] - 1, +wk.sv[2] + ev.off)); return fmtD(dt) + '（' + '日月火水木金土'[dt.getUTCDay()] + '） ' + ev.label + (ev.good? ' <span style="color:#ffd88a;">金運の追い風</span>': ' <span style="color:#ff9d85;">出費注意</span>');}).join('<br>') + '</div>': '') +
'</div>';
});
html += '</div>';
html += '<p style="font-size:12px; color:#8a8178; line-height:1.8;">いちばん上の表示は、週の区切りにこだわらず、配置がいちばん集まる7日間です。下の週リストは月曜〜日曜で数えています。判定のしかた：配置のピークがその期間に来るものを数えています。好調の配置で「拡大の星（木星）」と「お金・魅力の星（金星・太陽）」が組んだものは強く、それ以外の追い風は弱めに数えています。注意の配置で金星・木星・海王星が絡むものは「出費注意」。空の月は除いています。星は傾けるが、縛りはしない——あくまでお金の計画の目安に。</p>';
box.innerHTML = html;
var __hd = document.querySelector('.topTab'); __hd = __hd ? __hd.closest('[style*="sticky"]') : null; var yy = box.getBoundingClientRect().top + window.scrollY - (__hd ? __hd.offsetHeight : 0) - 12; window.scrollTo({ top: yy, behavior: 'smooth' });
