}
function pPos(jd, planet) {

if (hasTime) natal[1] = pPos(jdN, 1);

html += '</div>';
html += '<p style="font-size:12px; color:#8a8178; line-height:1.8;">いちばん上の表示は、週の区切りにこだわらず、配置がいちばん集まる7日間です。下の週リストは月曜〜日曜で数えています。判定のしかた：配置のピークがその期間に来るものを数えています。好調の配置で「恋の星（金星・火星）」と「後押しの星（太陽・木星・天王星）」が組んだものは強く、それ以外の追い風は弱めに数えています。注意の配置で金星・火星・水星が絡むものは「すれ違い注意」。空の月は除いています。星は傾けるが、縛りはしない——あくまで一歩踏み出す目安に。</p>';
