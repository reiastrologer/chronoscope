    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background-color: #0d0c0a; font-family: 'Noto Sans JP', sans-serif; color: #faf6f0; line-height: 1.6; }
      .topTab { display: block; text-align: center; padding: 13px 8px; border-radius: 12px; background: linear-gradient(135deg, rgba(197,168,128,0.28), rgba(197,168,128,0.10)); border: 1px solid #c5a880; color: #e8cf9f; font-weight: 700; font-size: 15px; text-decoration: none; }
      .topTab.active { background: linear-gradient(135deg, rgba(255,216,138,0.55), rgba(197,168,128,0.25)); color: #ffe9b8; border-color: #ffd88a; }

  <body>
    <div style="max-width: 880px; margin: 0 auto; padding: 24px 16px 0;">
      <div style="border: 1px solid #c5a880; outline: 3px double rgba(197,168,128,0.55); outline-offset: 5px; padding: 16px 12px 12px; text-align: center; background: radial-gradient(ellipse at center, rgba(197,168,128,0.10), rgba(197,168,128,0.02));">
        <div style="font-family: 'Times New Roman', 'Noto Serif JP', serif; font-size: 11px; letter-spacing: 0.55em; color: #9a8d7a;">CHRONOSCOPE</div>
        <div style="font-family: 'Noto Serif JP', serif; font-size: 26px; font-weight: 700; color: #e8cf9f; letter-spacing: 0.16em; margin-top: 4px;">クロノスコープ</div>
        <div style="font-family: 'Times New Roman', serif; font-style: italic; font-size: 12px; color: #bdb098; letter-spacing: 0.08em; margin-top: 6px;">Astra inclinant, non necessitant</div>
      </div>
    </div>
    <div style="max-width: 880px; margin: 0 auto; padding: 14px 16px 10px; position: sticky; top: 0; z-index: 60; background: rgba(13, 12, 10, 0.94);">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <a href="./seikaku.html" class="topTab">🌟 性格チェック</a>
        <a href="./unsei.html" class="topTab">🔮 個人の運勢</a>
        <a href="./aisho.html" class="topTab">💞 相性診断</a>
        <a href="./omajinai.html" class="topTab active">✨ クロノスくんのおまじない</a>
      </div>
    </div>
    <div style="max-width: 880px; margin: 10px auto 0; padding: 0 16px; text-align: center;">
      <h1 style="font-family: 'Noto Serif JP', serif; font-size: 22px; color: #e8cf9f; margin-bottom: 6px;">✨ クロノスくんのおまじない</h1>
      <p style="font-size: 13px; color: #9a8d7a;">悩んでるあなたへ。ボタンを押すと、クロノスくんが動いて、ひとこと届きます。何度でも押せます。</p>
    </div>
<!-- クロノスくんのおまじない（運勢盤） -->
    <div id="mgNav"></div>
    <style>
      .mgStage { position: relative; min-height: 300px; margin-top: 14px; }
      .mgImg { width: 158px; border-radius: 22px; border: 2px solid #c5a880; box-shadow: 0 0 26px rgba(232,207,159,0.35); animation: mgBob 1.6s ease-in-out infinite; }
      .mgSparkle { position: absolute; animation: mgTwinkle 1.1s ease-in-out infinite; }
      .mgMsg { font-family: 'Noto Serif JP', serif; font-size: 17px; color: #e8cf9f; margin-top: 10px; opacity: 0; animation: mgMsgIn 0.9s ease 0.7s forwards; }
      @keyframes mgBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes mgTwinkle { 0%, 100% { opacity: 0.15; transform: scale(0.7) rotate(0deg); } 50% { opacity: 1; transform: scale(1.25) rotate(20deg); } }
      @keyframes mgMsgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
    <div style="max-width: 880px; margin: 0 auto; padding: 0 16px; text-align: center;">
      <p style="font-size: 13px; color: #8a8178; margin-bottom: 10px;">― 悩んでるあなたへ ―</p>
      <button id="mgBtn" type="button" style="background: linear-gradient(135deg, rgba(197,168,128,0.35), rgba(197,168,128,0.12)); color: #e8cf9f; border: 1px solid #c5a880; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif;">✨ クロノスくんのおまじない ✨</button>
      
      <div id="mgStage" class="mgStage" style="display: none;"></div>
    </div>
    <script>
      (function () {
        var MSGS = [
          'だいじょうぶ。星は、ちゃんと回ってるよ。',
          '今日はゆっくりでいい日。焦らなくて大丈夫。',
          '悪い流れは、長くは続かないよ。',
          '悩むのは、一生懸命生きてる証拠だよ。',
          '深呼吸して。クロノスが、そばにいるよ。',
          '大丈夫。明日は、今日よりちょっとだけ軽くなるよ。',
          'あなたの星は、ちゃんと進んでるよ。'
        ];
        var SP = [[6,8],[16,72],[26,30],[38,84],[50,14],[62,76],[72,26],[84,66],[92,40],[30,58],[56,44],[78,88]];
        document.getElementById('mgBtn').addEventListener('click', function () {
          var st = document.getElementById('mgStage');
          var sp = SP.map(function (p, i) {
            return '<span class="mgSparkle" style="top:' + p[0] + '%; left:' + p[1] + '%; font-size:' + (13 + (i % 4) * 5) + 'px; animation-delay:' + ((i % 6) * 0.18) + 's;">' + (i % 3 === 0 ? '⭐' : '✨') + '</span>';
          }).join('');
          var VIDS = [6, 7, 4, 1, 2, 3, 5]; // 文章の順に対応する動画番号（内容で対応付け）
          var FILES = ['動画1 ハート.mp4', '動画2 指ハート.mp4', '動画3 ダンス.mp4', '動画4 バク転.mp4', '動画5 回転.mp4', '動画6 星キャッチ.mp4', '動画7 おやすみ.mp4'];
          var mi = Math.floor(Math.random() * MSGS.length);
          st.innerHTML = sp + '<div style="padding-top:18px;"><video class="mgImg" src="./' + encodeURIComponent(FILES[VIDS[mi] - 1]) + '" poster="./chronos_magic_poster.jpg" autoplay loop muted playsinline></video></div>' +
            '<div class="mgMsg">' + MSGS[mi] + '</div>';
          st.style.display = 'none';
          void st.offsetWidth;
          st.style.display = 'block';
          st.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      })();
    </script>
    <div style="max-width: 880px; margin: 30px auto 0; padding: 0 16px 28px; text-align: center;">
      <p style="font-size: 12px; color: #8a8178;"><a href="./privacy.html" style="color: #9a8d7a;">プライバシーと安全性について（入力した情報は送信・保存されません）</a></p>
    </div>
  </body>
</html>
