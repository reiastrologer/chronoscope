<p style="font-size: 13px; color: #9a8d7a;">クロノスくんとクロコちゃんのタロットが、今日のあなたに1枚。日付が変わるとカードも変わります。その日は何度見ても、同じカードです。</p>

<p style="font-size:12px; color:#8a8178; line-height:1.8; margin-top:16px;">相手の気持ちが気になる時は、<a href="./kimochi.html" style="color:#e8cf9f;">💗 相手の気持ち</a>で3枚引きの詳しい読みもどうぞ。</p>

<script>
(function () {
var TAROT_DAILY = [
{ n: '0 愚者', up: '新しい一歩に追い風。計画より先に、まず動いてみる日。', rev: '勢いだけで進むと足元がゆるい日。持ち物と予定を一度チェック。' },
{ n: 'I 魔術師', up: 'やりたいことを形にできる日。道具と段取りがそろっています。', rev: '手先だけが先行しがち。目的を思い出してから始めよう。' },
{ n: 'II 女教皇', up: '直感が冴える日。静かな場所で考える時間が、答えをくれます。', rev: '考えすぎて動けないかも。小さなことから決めていこう。' },
{ n: 'III 女帝', up: '豊かさと優しさの日。美味しいもの、好きなものに囲まれて。', rev: '甘やかしすぎ注意。自分にも周りにも、ほどほどが心地いい。' },
{ n: 'IV 皇帝', up: 'リードすると上手くいく日。決めるべきことは、今日決めよう。', rev: '力みすぎは禁物。人の意見を一つ聞くと、視界が広がります。' },
{ n: 'V 教皇', up: '信頼できる人の助言が効く日。基本を守ると強い日です。', rev: '常識に縛られすぎかも。あなたの正解は、別にあるかもしれません。' },
{ n: 'VI 恋人', up: '心が通う日。好きな人、好きなことに素直になって。', rev: '迷いが生じやすい日。大事な選択は、明日以降でも遅くない。' },
{ n: 'VII 戦車', up: '前進あるのみの日。勢いに乗って、進めるところまで進もう。', rev: '空回りに注意。方向を確かめてからアクセルを。' },
{ n: 'VIII 力', up: '優しさが強さになる日。焦らず向き合えば、道は開けます。', rev: '気持ちが揺れやすい日。無理に抑えず、休むことも力のうち。' },
{ n: 'IX 隠者', up: '一人の時間が実りになる日。内側の声を聞いてみて。', rev: '閉じこもりすぎ注意。短い外出や連絡が、気分を変えます。' },
{ n: 'X 運命の輪', up: '流れが動き出す日。来たチャンスは、素早く掴んで。', rev: '思い通りにならなくても、流れの一部。焦らず次の波を待とう。' },
{ n: 'XI 正義', up: 'バランス感覚が冴える日。約束と公平さを大切に。', rev: '白黒つけすぎ注意。グレーを許すと、楽になります。' },
{ n: 'XII 吊るされた男', up: '待つことが実る日。見方を変えると、意味が見えてきます。', rev: '我慢の限界が近いかも。手放せるものは手放して、軽くなろう。' },
{ n: 'XIII 死神', up: '終わりは始まりの日。区切りをつけると、次が入ってきます。', rev: '終われないものに引きずられがち。少しずつ離れていこう。' },
{ n: 'XIV 節制', up: 'ほどよい配分が鍵の日。混ぜ合わせると、新しい味になります。', rev: 'ペース配分が乱れがち。詰め込みすぎず、余白を作って。' },
{ n: 'XV 悪魔', up: '欲しいものに正直になる日。楽しさに身を任せるのも大事。', rev: 'ハマりすぎ注意。お金と時間の使い方を、一度見直そう。' },
{ n: 'XVI 塔', up: '予定変更が起きやすい日。でも壊れるのは、古い殻だけです。', rev: '小さな違和感は見逃さないで。早めの修正が、大きな崩れを防ぎます。' },
{ n: 'XVII 星', up: '希望が見える日。願いを言葉にすると、近づいてきます。', rev: '理想と現実の差に落ち込むかも。今日できる一歩は、小さいままでOK。' },
{ n: 'XVIII 月', up: '気持ちが揺れる日。はっきりしないことは、はっきりするまで待って。', rev: '不安が薄れていく日。昨日の悩みは、今日の光で見直せます。' },
{ n: 'XIX 太陽', up: '明るく開ける日。笑顔でいると、良いことが寄ってきます。', rev: '元気が空回りしがち。日陰で休む時間も作って。' },
{ n: 'XX 審判', up: '再チャレンジに追い風の日。過去の経験が、今の力になります。', rev: '結論を急がないで。材料がそろうまで、保留も立派な判断。' },
{ n: 'XXI 世界', up: '一区切りが実る日。達成感を味わって、次の景色へ。', rev: 'あと一歩のところ。最後の詰めを丁寧にすれば、完成します。' }
];
function hashSeed(str) { var h = 2166136261; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var now = new Date();
var key = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
var rng = mulberry32(hashSeed('chronotarot|' + key));
var ci = Math.floor(rng() * 22);
var rev = rng() < 0.3;
var c = TAROT_DAILY[ci];
var box = document.getElementById('tResult');
box.innerHTML = '<div style="border:1.5px solid #ffd88a; border-radius:14px; padding:18px 16px; background:rgba(255,216,138,0.07); text-align:center;">'
+ '<div style="font-size:13px; color:#ffd88a; font-weight:700;">🃏 今日のカード（' + (now.getMonth() + 1) + '月' + now.getDate() + '日）</div>'
+ '<img src="./tarot' + (ci < 10 ? '0' : '') + ci + '.webp" alt="' + c.n + '" style="width:min(280px, 80%); border-radius:10px; margin-top:12px;' + (rev ? ' transform:rotate(180deg);' : '') + '">'
+ '<div style="font-size:19px; font-weight:700; color:#ffe9b8; margin-top:10px;">' + c.n + '</div>'
+ '<div style="font-size:12.5px; color:' + (rev ? '#7a9fc5' : '#ffd88a') + '; margin-top:2px;">' + (rev ? '逆位置' : '正位置') + '</div>'
+ '<div style="font-size:14.5px; color:#faf6f0; line-height:1.9; margin-top:10px;">' + (rev ? c.rev : c.up) + '</div>'
+ '</div>';
})();
</script>
